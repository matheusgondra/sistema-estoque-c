name: CI/CD Build e Release

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build no Linux (Ubuntu)
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v4
      
    - name: Instalar dependências (GCC, Make, Libpq)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpq-dev
        
    - name: Compilar o projeto
      run: make

    - name: Salvar Artefato (Linux)
      uses: actions/upload-artifact@v4
      with:
        name: sistema-estoque-linux
        path: sistema-de-estoque

  build-windows:
    name: Build no Windows
    runs-on: windows-latest
    
    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v4

    # Substituímos o MSYS2 pela instalação nativa do PostgreSQL 16 via Chocolatey.
    # Isso cria a pasta "C:\Program Files\PostgreSQL\16" que o seu Makefile precisa.
    - name: Instalar PostgreSQL (Windows)
      run: |
        choco install postgresql --version=16.4.0 -y --force
        echo "C:\Program Files\PostgreSQL\16\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Usamos shell: bash para garantir que awk, cut e mkdir -p do seu Makefile funcionem.
    # O windows-latest já possui o GCC embutido, então não precisamos instalar um compilador separado.
    - name: Compilar o projeto
      shell: bash
      run: make

    - name: Salvar Artefato (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: sistema-estoque-windows
        path: sistema-de-estoque.exe

  release:
    name: Publicar Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Baixar todos os artefatos
      uses: actions/download-artifact@v4
      with:
        path: executaveis
        merge-multiple: true

    - name: Criar Release e Fazer Upload dos Arquivos
      uses: softprops/action-gh-release@v2
      with:
        files: |
          executaveis/sistema-de-estoque
          executaveis/sistema-de-estoque.exe
        generate_release_notes: true