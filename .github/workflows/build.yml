name: CI/CD Build e Release

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "develop" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build no Linux (Ubuntu)
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v4

    - name: Instalar dependências de build
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-14 cmake ninja-build

    - name: Configurar vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
        "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

    - name: Configurar o CMake
      run: cmake --preset default

    - name: Compilar o projeto
      run: cmake --build --preset default --parallel

    - name: Salvar Artefato (Linux)
      uses: actions/upload-artifact@v4
      with:
        name: sistema-estoque-linux
        path: build/sitema-estoque-c

  build-windows:
    name: Build no Windows
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v4

    - name: Configurar vcpkg
      shell: pwsh
      run: |
        git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

    - name: Configurar e compilar o projeto
      shell: pwsh
      run: |
        cmake --preset default
        cmake --build --preset default --parallel

    - name: Salvar Artefato (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: sistema-estoque-windows
        path: build/sitema-estoque-c.exe
  
  release:
    name: Publicar Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Baixar todos os artefatos
      uses: actions/download-artifact@v4
      with:
        path: executaveis
        merge-multiple: true

    - name: Criar Release e Fazer Upload dos Arquivos
      uses: softprops/action-gh-release@v2
      with:
        files: |
          executaveis/sitema-estoque-c
          executaveis/sitema-estoque-c.exe
        generate_release_notes: true